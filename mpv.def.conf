# ==============================================================================
# MPV Core Configuration Reference (mpv.def.conf)
# High-Performance Video Rendering & Hardware Acceleration
# Copy to 'mpv.conf' to apply these settings.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. VIDEO RENDERING & HARDWARE ACCELERATION
# ------------------------------------------------------------------------------

# Modern libplacebo-based GPU renderer (Recommended for high fidelity & HDR tone-mapping)
# Values: gpu-next | gpu
vo=gpu-next

# Hardware video decoding API
# Values: auto-safe | vaapi (Linux Intel/AMD) | nvdec (Nvidia) | d3d11va (Windows) | videotoolbox (macOS)
hwdec=auto-safe

# Suppress repetitive FFmpeg packet decode warnings
msg-level=ffmpeg=error

# Audio/Video clock synchronization mode
# Values: audio | display-resample
video-sync=audio

# High-Quality Scalers (Fluid 60fps on 4K)
scale=spline36
cscale=spline36
dscale=mitchell

# Gradient Debanding (Prevents compression banding on dark scenes)
deband=yes
deband-iterations=1
deband-threshold=35
deband-range=16
deband-grain=5

# Colorspace & HDR handling
icc-profile-auto=no
target-colorspace-hint=yes

# ------------------------------------------------------------------------------
# 2. WINDOW BEHAVIOR & CONTROLS (CRITICAL FOR LUMINAX)
# ------------------------------------------------------------------------------

# Disable stock mpv On-Screen Controller (Required: LuminaX replaces this)
osc=no

# Disable stock mpv progress bar (Required: LuminaX renders custom glass bar)
osd-bar=no

# Clean window title without messy file extensions
title="${filename/no-ext}"

# Prevent oversized 4K windows from spilling outside desktop boundaries
autofit-larger=85%x85%

# Open window centered on screen
geometry=50%:50%

# Pause on the final frame instead of abruptly closing the window
keep-open=yes

# Milliseconds of cursor inactivity before hiding the mouse pointer
cursor-autohide=1000

# Hide cursor in both windowed and fullscreen modes
cursor-autohide-fs-only=no

# Inhibit OS desktop screensaver while video is actively playing
stop-screensaver=yes

# ------------------------------------------------------------------------------
# 3. SUBTITLE STYLING
# ------------------------------------------------------------------------------

# Subtitle font family (Loaded from ~/.config/mpv/fonts/ or system)
sub-font="Inter"
sub-font-size=32
sub-bold=no

# Pure white text with delicate obsidian dark outline and translucent drop shadow
sub-color="#FFFFFFFF"
sub-border-style=outline-and-shadow
sub-border-size=1.8
sub-border-color="#101014E6"
sub-shadow-offset=1.2
sub-shadow-color="#000000A0"
sub-blur=0
sub-spacing=0.2

# Subtitle position anchored to bottom video frame
sub-margin-y=22
sub-align-y=bottom
sub-align-x=center
sub-use-margins=no

# Subtitle auto-loading and language preferences
sub-auto=fuzzy
slang=eng,en

# Dynamic Window Auto-Scaling for Subtitles
sub-scale-by-window=yes
sub-scale-with-window=yes
sub-scale=1.0

# ------------------------------------------------------------------------------
# 4. ON-SCREEN DISPLAY (OSD PILL MESSAGES)
# ------------------------------------------------------------------------------

osd-font="Inter"
osd-font-size=18
osd-bold=yes
osd-color="#FFFFFFFF"
osd-border-size=1.0
osd-border-color="#101014B0"
osd-shadow-offset=1.0
osd-shadow-color="#00000050"
osd-blur=0.3
osd-align-x=center
osd-align-y=top
osd-margin-y=28
osd-duration=1200
osd-scale-by-window=yes
osd-scale=1.0

# ------------------------------------------------------------------------------
# 5. AUDIO & HEADROOM
# ------------------------------------------------------------------------------

# Preferred audio languages (priority ordered)
alang=eng,en,ja,jpn,te,tel,hi,hin,ta,tam

# Initial playback volume
volume=90

# Maximum volume headroom for quiet dialog mixes
volume-max=150

# Maintain natural pitch when speeding up or slowing down playback
audio-pitch-correction=yes

# High-fidelity speed scaling filter without audio warbling
af=scaletempo2

# ------------------------------------------------------------------------------
# 6. SCREENSHOTS
# ------------------------------------------------------------------------------

screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-png-compression=7
screenshot-directory=~/Pictures/mpv
screenshot-template="%F-[%P]-#%n"

# ------------------------------------------------------------------------------
# 7. CACHE & PLAYBACK RESUMPTION
# ------------------------------------------------------------------------------

cache=yes
demuxer-max-bytes=250MiB
demuxer-max-back-bytes=150MiB

# Automatically remember playback position on quit
save-position-on-quit=yes
