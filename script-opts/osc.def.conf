# ==============================================================================
# LuminaX OSC & Screensaver Configuration Reference (osc.def.conf)
# Defines all available flags, valid values, defaults, and descriptions.
# Place this file as 'script-opts/osc.conf' to customize your setup.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. SCALING & WINDOW RESPONSIVENESS
# ------------------------------------------------------------------------------

# Scale the OSC controls with video resolution changes
# Values: yes | no
# Default: yes
vidscale=yes

# Scaling factor for the on-screen controller in windowed mode
# Values: Float (e.g. 0.8, 1.0, 1.2)
# Default: 1.0
scalewindowed=1.0

# Scaling factor for the on-screen controller in fullscreen mode
# Values: Float (e.g. 1.0, 1.05, 1.25)
# Default: 1.05
scalefullscreen=1.05

# Scaling factor when mpv renders on a forced window (e.g. audio-only mode)
# Values: Float
# Default: 2.0
scaleforcedwindow=2.0

# Minimum adaptive scaling factor for compact or tiled windows (e.g. 720p or narrow aspect)
# Values: Float (0.50 ~ 1.0)
# Default: 0.70
min_scale=0.70

# Maximum adaptive scaling factor for 4K / 8K ultra-high-resolution displays
# Values: Float (1.0 ~ 2.0)
# Default: 1.05
max_scale=1.05

# ------------------------------------------------------------------------------
# 2. VISIBILITY & AUTOHIDE BEHAVIOR
# ------------------------------------------------------------------------------

# Initial visibility mode of the controller
# Values:
#   auto   - Shows on mouse movement or pause; autohides after timeout
#   always - Permanently visible
#   never  - Permanently hidden (can toggle with Tab key)
# Default: auto
visibility=auto

# Display OSC when playback is in windowed mode
# Values: yes | no
# Default: yes
showwindowed=yes

# Display OSC when playback is in fullscreen mode
# Values: yes | no
# Default: yes
showfullscreen=yes

# Milliseconds of cursor inactivity before the OSC smoothly fades out
# Values: Integer (ms). Use negative (e.g. -1) for always-on.
# Default: 1200
hidetimeout=1200

# Duration of the smooth fade-out animation in milliseconds
# Values: Integer (ms). 0 = abrupt instant hide.
# Default: 200
fadeduration=200

# Minimum mouse displacement in pixels between ticks required to unhide OSC
# Values: Integer
# Default: 1
minmousemove=1

# Whether to keep the OSC visible while playback is paused
# Values: yes | no
# Default: yes
showonpause=yes

# Draw backdrop logo and text when player is in idle mode (no file loaded)
# Values: yes | no
# Default: yes
idlescreen=yes

# ------------------------------------------------------------------------------
# 3. TITLE & MEDIA INFORMATION
# ------------------------------------------------------------------------------

# Display the media title in the top glass header bar
# Values: yes | no
# Default: yes
showtitle=yes

# mpv property expansion template for the displayed title string
# Values: Any mpv format string (e.g. ${media-title}, ${filename/no-ext})
# Default: ${filename/no-ext}
title=${filename/no-ext}

# Format template string for chapter names displayed on the seekbar
# Values: Format string with %s placeholder, or "no" to disable
# Default: Chapter: %s
chapter_fmt=Chapter: %s

# ------------------------------------------------------------------------------
# 4. TIME & CLOCK DISPLAY
# ------------------------------------------------------------------------------

# Right-hand timecode format
# Values:
#   yes - Shows Total Duration (e.g. 01:48:22)
#   no  - Shows Playtime Remaining (e.g. -00:32:15)
# Default: yes
timetotal=yes

# Display precise time with millisecond resolution (.000)
# Values: yes | no
# Default: no
timems=no

# ------------------------------------------------------------------------------
# 5. SEEKBAR & PROGRESS SLIDER
# ------------------------------------------------------------------------------

# Size ratio of the circular seekbar thumb handle relative to bar height
# Values: Float (0.0 to 1.0)
# Default: 0.9
seekbarhandlesize=0.9

# Show cached / buffered seekrange bar behind playback position
# Values: yes | no
# Default: yes
seekrange=yes

# Transparency alpha for the seekrange overlay (0 = solid, 255 = invisible)
# Values: Integer (0 ~ 255)
# Default: 80
seekrangealpha=80

# Snap to keyframes when dragging the seekbar handle for instant response
# Values: yes | no
# Default: yes
seekbarkeyframes=yes

# ------------------------------------------------------------------------------
# 6. JUMP & SKIP BUTTONS
# ------------------------------------------------------------------------------

# Show circular QuickTime/visionOS jump forward and backward buttons
# Values: yes | no
# Default: yes
showjump=yes

# Seconds to skip on single left-click of jump buttons
# Values: 5 | 10 | 30
# Default: 10
jumpamount=10

# Display dynamic numeric badge inside jump icons (e.g. 5, 10, 30)
# Values: yes | no
# Default: yes
jumpiconnumber=no

# Seeking accuracy mode for jump buttons
# Values: exact | relative+keyframes
# Default: exact
jumpmode=exact

# ------------------------------------------------------------------------------
# ------------------------------------------------------------------------------
# 7. AUDIO ENHANCEMENTS & VOLUME CONTROLS
# ------------------------------------------------------------------------------

# Show volume button and volume slider on bottom OSC
# Values: yes | no
# Default: yes
volumecontrol=yes

# Interaction behavior for the volume slider pill
# Values:
#   hover  - Collapsed into speaker icon; smoothly expands slider on mouse hover
#   always - Permanently expanded slider
#   never  - Speaker mute toggle icon only; slider hidden
# Default: hover
volume_slider_mode=hover

# Note on Audio Drawer Enhancements:
# Access via 'a' key or audio icon on OSC. Features:
#   - Audio Profile Stepper: Instant cycle through 5 studio-grade DSP enhancement presets:
#       * Off: Bit-perfect direct passthrough.
#       * Night Mode: Smart dynamic range normalization (dynaudnorm) taming explosions & lifting whispers.
#       * Voice Boost: Subtractive 300Hz mud scooping + 3.2kHz presence boost with -3.5dB preamp headroom.
#       * Cinema Bass: Deep 105Hz low-end rumble with -4.5dB preamp and true-peak alimiter protection.
#       * Spatial Headphone: Bauer binaural crossfeed (bs2b) eliminating "in-the-head" listening fatigue.
#   - Audio Delay Stepper: Micro-sync adjustments (±100ms) with visual indicator.
#   - Centered Glass Card: Ergonomic centered presentation without edge clipping.

# ------------------------------------------------------------------------------
# 8. VIDEO ADJUSTMENTS & PICTURE TUNING DRAWER
# ------------------------------------------------------------------------------

# Note on Video Drawer Controls:
# Access via 'V' key or video tuning icon on OSC. Features:
#   - Ultra-compact 34px row height displaying all 10 controls without scrolling:
#     Contrast, Brightness, Gamma, Saturation, Hue, Panscan, Zoom, Deinterlace,
#     Deband, and Aspect Ratio.
#   - Centered Glass Modal: Floats centered on screen for undistorted picture comparison.
#   - Instant One-Click Reset: Resets all picture adjustments to neutral 0.

# ------------------------------------------------------------------------------
# 9. SUBTITLE CUSTOMIZATION STUDIO
# ------------------------------------------------------------------------------

# Note on Subtitle Configuration:
# Access via 'Alt+s' key or Subtitles menu. Features:
#   - Left-Docked Ergonomics: Docked to left edge (2% screen width, 78% bottom limit)
#     so video action and subtitles remain fully visible while customizing.
#   - Real-Time Live Preview Pill: Centered live subtitle badge showing active styling.
#   - Comprehensive Steppers: Font size, colors, borders, shadows, vertical position,
#     and Subtitle Delay micro-sync.
#   - Persistence: Automatically saved to script-opts/lumina_subtitle.json.

# ------------------------------------------------------------------------------
# 10. WINDOW CONTROLS & ERGONOMICS
# ------------------------------------------------------------------------------

# Window controls (minimize / maximize / close) in the top-right corner
# Values: auto | yes | no
# Default: no
windowcontrols=no

# Directional arrow key navigation for OSC interactive elements
# Values: yes | no
# Default: no
keyboardnavigation=no

# Primary UI font face (Loaded from ~/.config/mpv/fonts/ or system fonts)
# Values: Font family name (e.g. Inter, Roboto, SF Pro Display)
# Default: Inter
font=Inter

# UI localization language code
# Values: eng (English) | chs (Simplified Chinese)
# Default: eng
language=eng

# ------------------------------------------------------------------------------
# 11. TMDB PAUSE SCREENSAVER
# ------------------------------------------------------------------------------

# Enable rich TMDB movie/TV metadata pause screensaver with logo overlays
# Values: yes | no
# Default: yes
screensaver_enabled=yes

# Seconds of pause before screensaver fades in smoothly
# Values: Float or Integer (seconds)
# Default: 5
screensaver_delay=5

# Visual layout alignment for the pause screensaver
# Values:
#   center - Centered cinema layout: centered logo/title, badges, synopsis, and specs pill
#   split  - Symmetrical 2-column layout: media logo/title left, specs card right
# Default: center
screensaver_align=center

# Primary font face for media titles on the screensaver when no logo is found (or logo_engine=text)
# Values: Font face name (e.g. NewYork, Inter)
# Default: NewYork
screensaver_film_font=NewYork

# Your free Developer API key from themoviedb.org
# Sign up at: https://www.themoviedb.org/settings/api
# Values: 32-character hex key string
# Default: ""
tmdb_api_key=your_api_key_here

# Logo processing engine for hardware BGRA scaling and inversion
# Values:
#   auto   - Native FFmpeg with Python fallback
#   ffmpeg - 100% native hardware FFmpeg filtergraph (Zero Python dependency)
#   text   - Bypass logo engine completely and display styled text title (no graphic logo)
# Default: auto
logo_engine=auto

# Enable disk and memory caching for fetched TMDB metadata and scaled logos
# Values: yes | no
# Default: yes
tmdb_cache_lookup=yes

# Maximum disk cache storage size in Megabytes (automatic LRU eviction)
# Values: Integer (MB)
# Default: 250
tmdb_cache_max_mb=250

# OLED Anti-Burn-In Protection (Periodic pixel micro-drift during pause)
# Recommended for OLED/QD-OLED panels. On IPS/LCD displays, set to 'no' to keep screensaver perfectly stationary.
# Values: yes | no
# Default: no
screensaver_anti_burnin=no

# ------------------------------------------------------------------------------
# 8. AUTOMATIC UPDATE CHECKS
# ------------------------------------------------------------------------------

# Enable periodic GitHub release checks in the background (completely silent if up to date)
# Values: yes | no
# Default: yes
check_updates=yes

# Frequency of automatic update checks in days
# Values: Integer (days)
# Default: 3
check_update_interval_days=3

# ------------------------------------------------------------------------------
# 9. SUBTITLE INTELLIGENCE
# ------------------------------------------------------------------------------

# Automatically switch subtitle preset to Anime Fansub (bold boxless 2.8px black contour)
# when TMDB identifies the media genre as 'Animation' / anime.
# Values: yes | no
# Default: yes
sub_auto_anime_preset=yes

# ------------------------------------------------------------------------------
# 10. SMART CHAPTER SKIP & SEEKBAR ZONE TINTING
# ------------------------------------------------------------------------------

# Smart Chapter Skip mode for Opening / Intro / Recap / Outro
# Values:
#   pill - Displays a compact rounded rectangle [ SKIP (5s) ⏎ ] with floor progress rail
#   auto - Automatically seeks past the chapter and displays a brief toast
#   no   - Disabled
# Default: pill
smart_skip_mode=pill

# Only skip intros/outros if the media is identified as a TV/anime series,
# protecting movie credits and standard theatrical endings from being skipped.
# Values: yes | no
# Default: yes
smart_skip_series_only=yes

# Subtly shade chapter zones on the timeline seekbar
# (Cyan for Intro / Opening / Recap, Warm Amber for Outro / Ending)
# Values: yes | no
# Default: yes
chapter_zone_tinting=yes

# Countdown duration in seconds for intro/outro/recap skip button before dismissal
# Values: Integer (seconds)
# Default: 6
smart_skip_countdown=6

# Vertical distance in canvas pixels from screen bottom
# Positioned at 170 to keep button constant, stationary, and comfortably above the OSC scrim and seekbar
# Values: Integer (pixels)
# Default: 170
smart_skip_bottom_margin=170

# ------------------------------------------------------------------------------
# 11. NEXT EPISODE BINGE SYSTEM
# ------------------------------------------------------------------------------

# Show a floating Next Episode countdown card when entering the ending chapter
# or in the final 25 seconds of an episodic release
# Values: yes | no
# Default: yes
next_episode_card=yes

# Countdown duration in seconds before auto-advancing to the next episode
# Values: Integer (seconds)
# Default: 10
next_episode_countdown=10

# Playtime remaining threshold in seconds to trigger the Next Episode card
# Values: Integer (seconds)
# Default: 25
next_episode_threshold=25
