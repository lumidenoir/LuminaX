# ==============================================================================
# MPV Stats Style Configuration Reference (stats.def.conf)
# visionOS Glass Aesthetic for Shift+i / i Stats Overlay
# Copy to 'script-opts/stats.conf' to customize your setup.
# ==============================================================================

# Font face for stats page (Inter matches the visionOS UI)
font=Inter

# Font size in points
font_size=14

# Text font color in hex RGB (FFFFFF = Pure White)
font_color=FFFFFF

# Outline border color in hex RGB (161618 = Dark Obsidian)
border_color=161618

# Border outline thickness in pixels
border_size=1

# Background scrim alpha transparency (0 = solid, 255 = fully transparent)
# 15 = subtle dark frosted glass tint
alpha=15

# Highlight color for graph lines and active metrics
plot_bg_border_color=202026
plot_bg_color=101014
plot_color=7EA2D6
