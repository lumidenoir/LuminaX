# ==============================================================================
# MPV Keybindings Reference (input.def.conf)
# Ergonomic Apple QuickTime style shortcuts & LuminaX interactive glass menus
# Copy to 'input.conf' to customize your keybindings.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. WINDOW & APPLICATION CONTROL
# ------------------------------------------------------------------------------
q                 quit                         # Close player
f                 cycle fullscreen             # Toggle fullscreen
ESC               set fullscreen no            # Exit fullscreen / dismiss menu
MBTN_LEFT_DBL     cycle fullscreen             # Double-click to toggle fullscreen

# ------------------------------------------------------------------------------
# 2. PLAYBACK & PAUSE
# ------------------------------------------------------------------------------
SPACE             cycle pause                  # Play / Pause (triggers screensaver on 3s pause)
MBTN_LEFT         cycle pause                  # Left-click video to toggle pause

# ------------------------------------------------------------------------------
# 3. SEEKING & SCRUBBING
# ------------------------------------------------------------------------------
LEFT              seek -10                     # Skip backward 10 seconds
RIGHT             seek 10                      # Skip forward 10 seconds
Shift+LEFT        seek -1 exact                # Frame-accurate 1s backward
Shift+RIGHT       seek 1 exact                 # Frame-accurate 1s forward
WHEEL_UP          seek 10                      # Scroll wheel seek forward
WHEEL_DOWN        seek -10                     # Scroll wheel seek backward
Ctrl+LEFT         add chapter -1               # Previous chapter
Ctrl+RIGHT        add chapter 1                # Next chapter

# ------------------------------------------------------------------------------
# 4. PLAYBACK SPEED (PITCH-CORRECTED)
# ------------------------------------------------------------------------------
[                 no-osd multiply speed 1/1.1  # Slow down 10%
]                 no-osd multiply speed 1.1    # Speed up 10%
BS                no-osd set speed 1.0         # Reset speed to 1.0x

# ------------------------------------------------------------------------------
# 5. ANIME / TV INTRO & OUTRO SKIPS
# ------------------------------------------------------------------------------
n                 seek 85                      # Skip 85 seconds (Standard Anime Opening)
N                 seek -85                     # Seek back 85 seconds

# ------------------------------------------------------------------------------
# 6. AUDIO & VOLUME CONTROL
# ------------------------------------------------------------------------------
UP                no-osd add volume 5          # Volume up 5%
DOWN              no-osd add volume -5         # Volume down 5%
Ctrl+WHEEL_UP     no-osd add volume 2          # Fine volume wheel up
Ctrl+WHEEL_DOWN   no-osd add volume -2         # Fine volume wheel down
m                 no-osd cycle mute            # Toggle mute

# ------------------------------------------------------------------------------
# 7. AUDIO & SUBTITLE SYNC ADJUSTMENT & SIZING
# ------------------------------------------------------------------------------
z                 add sub-delay -0.1           # Shift subtitles earlier (100ms)
Z                 add sub-delay +0.1           # Shift subtitles later (100ms)
Ctrl+Shift+LEFT   add audio-delay -0.100       # Shift audio earlier (100ms)
Ctrl+Shift+RIGHT  add audio-delay +0.100       # Shift audio later (100ms)
Shift+G           add sub-scale +0.05          # Increase subtitle font size
Shift+F           add sub-scale -0.05          # Decrease subtitle font size
Ctrl+=            add sub-scale +0.05          # Increase subtitle font size
Ctrl+-            add sub-scale -0.05          # Decrease subtitle font size
Ctrl+0            set sub-scale 1.0            # Reset subtitle font size

# ------------------------------------------------------------------------------
# 8. SCREENSHOTS
# ------------------------------------------------------------------------------
S                 screenshot                   # Capture frame with subtitles
Ctrl+s            screenshot video             # Capture raw video frame (clean)

# ------------------------------------------------------------------------------
# 9. LUMINAX INTERACTIVE GLASS MENUS & CONTROLLER
# ------------------------------------------------------------------------------
Tab               script-binding LuminaX/visibility          # Toggle controller visibility (auto/always/never)
p                 script-binding LuminaX/menu-playlist        # Open Glass Playlist menu
c                 script-binding LuminaX/menu-chapters        # Open Glass Chapters menu
a                 script-binding LuminaX/menu-audio           # Open Glass Audio Tracks menu
s                 script-binding LuminaX/menu-sub             # Open Glass Subtitle Tracks menu
Alt+s             script-binding LuminaX/menu-sub-config      # Open Subtitle Style & Configuration menu
V                 script-binding LuminaX/menu-video           # Open Video Picture Settings & Adjustments menu
T                 script-binding LuminaX/toggle-tags-menu     # Open Tag Editor & Title Cleaner
Ctrl+t            script-binding LuminaX/toggle-tags-menu-ctrl# Open Tag Editor & Title Cleaner
v                 cycle sub-visibility                        # Toggle subtitle visibility
i                 script-binding stats/display-stats-toggle   # Toggle detailed hardware/codec stats
h                 script-binding stats/display-page-4-toggle  # Codec frame timeline graph
